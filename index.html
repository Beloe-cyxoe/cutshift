<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cut/shift — блочный коллаж из фото</title>
<meta name="description" content="Режь фото на блоки, сдвигай и дублируй фрагменты. Браузерный инструмент для глитч-коллажей: всё работает локально, фото никуда не загружается.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="cut/shift">
<meta property="og:description" content="Блочный коллаж и глитч из любого фото прямо в браузере">
<meta property="og:url" content="https://beloe-cyxoe.github.io/cutshift/">
<meta property="og:image" content="https://beloe-cyxoe.github.io/cutshift/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0C; --card:#141416; --cardline:#232326;
  --row:#1C1C1F; --rowhov:#212125; --rowfill:#29292D; --tick:#56565C;
  --sel:#34343A; --ink:#EDEDEA; --muted:#85858B; --dim:#5C5C62;
  --primary:#EDEDEA; --on-primary:#0B0B0C;
  --r-row:14px; --r-card:22px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.35 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:348px minmax(0,1fr);height:100%}

/* ---------- panel ---------- */
.panel{border-right:1px solid var(--cardline);display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:0 12px 12px;scrollbar-width:thin;scrollbar-color:#2c2c30 transparent}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 6px 14px}

.brand{position:relative;display:inline-block;font-size:21px;font-weight:500;letter-spacing:-.025em;line-height:1}
.brand span{display:block;white-space:nowrap}
.brand span+span{position:absolute;inset:0}
.brand .s1{clip-path:inset(0 0 60% 0)}
.brand .s2{clip-path:inset(40% 0 32% 0);transform:translateX(2px)}
.brand .s3{clip-path:inset(68% 0 0 0);transform:translateX(-1px)}

/* presets */
.presets{display:grid;grid-auto-flow:column;grid-auto-columns:60px;gap:8px;overflow-x:auto;padding:4px 4px 14px;margin:0 -2px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.pre{background:none;border:0;padding:0;text-align:left;color:var(--muted)}
.pre canvas{display:block;width:60px;height:76px;object-fit:cover;border-radius:14px;background:var(--row);box-shadow:0 0 0 1px var(--cardline)}
.pre[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}

/* section cards */
.sec{background:var(--card);border:1px solid var(--cardline);border-radius:var(--r-card);padding:6px;margin-bottom:10px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:8px}
.sect{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:14px 10px;font-size:15px;color:var(--muted);text-align:left;border-radius:12px}
.sect:hover{color:var(--ink)}
.sect[aria-expanded="true"]{color:var(--ink)}
.chev{width:12px;height:12px;flex:none;transition:transform .2s}
.sect[aria-expanded="true"] .chev{transform:rotate(90deg)}
.secb{display:grid;gap:6px}
.grp{display:grid;gap:6px}

/* rows */
.pill{position:relative;min-height:46px;border-radius:var(--r-row);background:var(--row);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;overflow:hidden;font-size:15px}
.pill:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}

.range .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--rowfill);transition:background .15s}
.range .fill::after{content:"";position:absolute;top:0;bottom:0;right:-1.5px;width:1.5px;background:var(--tick)}
.range:hover .fill{background:#2E2E33}
.range:active .fill::after,.range:has(input:focus-visible) .fill::after{background:var(--ink)}
.pl,.pv{position:relative;z-index:1;pointer-events:none;white-space:nowrap}
.pl{overflow:hidden;text-overflow:ellipsis}
.pv b{font-weight:400}
.pv i{font-style:normal;color:var(--dim)}
.range input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:2;-webkit-appearance:none;appearance:none;background:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:46px}
.range input::-moz-range-thumb{width:2px;height:46px;border:0}

.segrow{padding:4px 4px 4px 16px}
.segrow.full{padding:4px}
.segrow.stack{flex-direction:column;align-items:stretch;gap:8px;padding:12px 4px 4px}
.segrow.stack > .pl{padding-left:12px;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;min-width:0}
.segrow.full .seg,.segrow.stack .seg{flex:1}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.segrow:not(.full):not(.stack) .seg button{min-width:34px;padding:9px 0}
.segrow:not(.full):not(.stack) .seg[style*="--n:2"] button{padding:9px 12px}
.seg[style*="--n:4"] button{font-size:13.5px;padding:9px 2px}

.sw{position:relative;flex:none;display:inline-block;width:46px;height:28px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:#2A2A2E;transition:background .18s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .18s,background .18s}
.sw input:checked + span{background:var(--ink)}
.sw input:checked + span::after{transform:translateX(18px);background:var(--on-primary)}
.sw:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px;border-radius:14px}

.tog{padding:12px 12px 12px 16px;cursor:pointer}
.tt{display:flex;flex-direction:column;gap:3px}
.tt small{color:var(--muted);font-size:12.5px;line-height:1.35}

.colorrow{--c:#000;background:var(--c);min-height:54px;padding:0 10px;cursor:pointer}
.chip{position:relative;z-index:1;pointer-events:none;background:rgba(0,0,0,.36);color:#fff;border-radius:9px;padding:5px 10px;font-size:15px;line-height:1.2}
.colorrow.darkc .chip{background:rgba(255,255,255,.14)}
.colorrow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

.f2{padding:6px 6px 6px 8px;gap:10px;justify-content:flex-start}
.f2 img{width:34px;height:34px;object-fit:cover;border-radius:9px;flex:none}
.f2t{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.f2 img:not([hidden]) + .f2t{padding-left:0;color:var(--ink)}
.mini{border:0;background:var(--sel);border-radius:10px;padding:8px 12px;font-size:14px}
.mini:hover{background:#3d3d44}
.note{color:var(--muted);font-size:12.5px;margin:2px 10px 6px;line-height:1.4}

/* actions */
.btn{min-width:0;height:46px;border:0;background:var(--row);border-radius:var(--r-row);padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{background:var(--rowhov)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:#fff}
.btn kbd{font:inherit;font-weight:400;color:var(--dim);margin-left:6px}
.actions{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-top:1px solid var(--cardline);background:var(--bg)}
.saverow{grid-column:1/-1;display:flex;gap:8px}
.saverow .seg{background:var(--row);border-radius:var(--r-row);padding:4px;--n:2;width:118px;flex:none}
.saverow .seg button{padding:0;height:38px}
.saverow .primary{flex:1}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:14px 18px;min-height:0;min-width:0;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seed{color:var(--muted);font-size:13px}
.stage.orig .seed{color:var(--ink)}
.tools{display:flex;gap:6px}
.ib,.tb{height:34px;border:0;border-radius:10px;background:var(--row);font-size:13px;padding:0 12px;display:grid;place-items:center}
.ib{width:34px;padding:0}
.ib svg{width:16px;height:16px}
.ib:hover,.tb:hover{background:var(--rowhov)}
.ib:disabled{opacity:.35;cursor:default;background:var(--row)}
.tb[aria-pressed="true"],.stage.orig #cmp{background:var(--ink);color:var(--on-primary)}
#cmp{touch-action:none;user-select:none;-webkit-user-select:none}

.view{position:relative;display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden;border-radius:16px}
.view.actual{display:flex;overflow:auto}
#out{display:block;margin:auto;flex:none;background:#1a1a1d conic-gradient(#232327 25%,#1a1a1d 0 50%,#232327 0 75%,#1a1a1d 0) 0 0/16px 16px;touch-action:pan-x pan-y}

.empty{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);padding:8px 8px 8px 18px;border-radius:18px;background:rgba(20,20,22,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--cardline);font-size:14px}
.empty p{margin:0;color:var(--ink)}
.empty .btn{height:40px;flex:none}

.strip{display:flex;align-items:center;gap:10px;min-height:56px;min-width:0}
.strip > span{color:var(--dim);font-size:12.5px;flex:none}
.hist{display:flex;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hs{flex:none;border:0;padding:0;background:none;border-radius:8px}
.hs canvas{display:block;height:46px;width:auto;border-radius:8px;opacity:.5;transition:opacity .15s}
.hs:hover canvas{opacity:.85}
.hs[aria-current="true"] canvas{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}

.drop{position:absolute;inset:0;display:none;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:rgba(11,11,12,.82);z-index:5}
.stage.dragging .drop{display:grid}
.dz{border:1.5px dashed var(--dim);border-radius:20px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:15px}
.dz small{display:block;font-size:12.5px;color:var(--dim);margin-top:4px}
.dz.hot{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.035)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--on-primary);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .stage{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;height:52svh;padding:10px 12px;gap:8px;background:var(--bg);border-bottom:1px solid var(--cardline)}
  .strip{min-height:44px}
  .strip > span{display:none}
  .hs canvas{height:36px}
  .panel{border-right:0}
  .scroll{overflow:visible}
  .empty{bottom:8px;padding:6px 6px 6px 14px;gap:10px;font-size:13px}
  .empty p{font-size:12.5px;line-height:1.3}
  .actions{position:sticky;bottom:0;z-index:2;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .btn kbd,.tb .k{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="scroll">
      <header class="head">
        <div class="brand" id="brand" aria-label="cut/shift"><span class="s1">cut/shift</span><span class="s2" aria-hidden="true">cut/shift</span><span class="s3" aria-hidden="true">cut/shift</span></div>
        <label class="mini" for="file" tabindex="0" id="fileLabel">Загрузить фото</label>
        <input id="file" type="file" accept="image/*" hidden>
      </header>
      <div class="presets" id="presets" role="group" aria-label="Готовые образы"></div>
      <div id="controls"></div>
    </div>
    <footer class="actions">
      <button id="shuffle" class="btn" type="button" title="Случайные настройки и раскладка блоков">Всё случайно<kbd>R</kbd></button>
      <div class="saverow">
        <div class="seg" id="fmt" role="group" aria-label="Формат файла"><button type="button" data-v="png">PNG</button><button type="button" data-v="jpg">JPG</button></div>
        <button id="save" class="btn primary" type="button">Скачать</button>
      </div>
    </footer>
  </aside>

  <main class="stage" id="stage">
    <div class="bar">
      <span class="seed" id="seedLbl"></span>
      <div class="tools">
        <button class="ib" id="undo" type="button" title="Отменить (⌘Z)" aria-label="Отменить"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8h-2"/></svg></button>
        <button class="ib" id="redo" type="button" title="Вернуть (⇧⌘Z)" aria-label="Вернуть"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 3.5 3 3-3 3"/><path d="M13.5 6.5h-7a4 4 0 0 0 0 8h2"/></svg></button>
        <button class="tb" id="cmp" type="button" title="Удерживай, чтобы увидеть исходник (пробел)">Оригинал</button>
        <button class="tb" id="fit" type="button" aria-pressed="false" title="Показать в реальном размере (F)">1:1</button>
      </div>
    </div>
    <div class="view" id="view">
      <canvas id="out" aria-label="Результат обработки фото"></canvas>
      <div class="empty" id="empty">
        <p>Перетащи сюда своё фото или вставь из буфера</p>
        <button type="button" class="btn primary" id="emptyBtn">Выбрать фото</button>
      </div>
    </div>
    <div class="strip"><span>История</span><div class="hist" id="hist" role="group" aria-label="История вариантов"></div></div>
    <div class="drop" aria-hidden="true">
      <div class="dz" data-t="main">Основное фото<small>заменит текущее</small></div>
      <div class="dz" data-t="second">Второе фото<small>для смешивания блоков</small></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const MAX = 2000;

const DEF = {
  mode:'tree', size:6, sizeVar:.55, detail:.7,
  amount:.5, shift:.06, dir:'h', snap:true,
  zoom:.15, tone:.25, passes:1,
  dropOn:false, drop:.25, fill:'#000000', clear:false,
  useSecond:false, mix:.35, seed:7
};
const LOOK = ['mode','size','sizeVar','detail','amount','shift','dir','snap','zoom','tone','passes','dropOn','drop','fill','clear','seed'];
const STATE = [...LOOK,'useSecond','mix'];
const P = {...DEF};

const PRESETS = [
  {name:'Лишний глаз', p:{mode:'tree',size:7,sizeVar:.5,detail:.8,amount:.45,shift:.05,dir:'h',snap:true,zoom:0,tone:.1,seed:311}},
  {name:'Полосы', p:{mode:'rows',size:2.5,sizeVar:.85,amount:.7,shift:.12,dir:'h',snap:false,zoom:.1,tone:.35,seed:902}},
  {name:'Мозаика', p:{mode:'grid',size:8,sizeVar:.6,amount:.6,shift:.08,dir:'any',snap:true,zoom:.3,tone:.3,seed:4417}},
  {name:'Лесенка', p:{mode:'cols',size:6,sizeVar:.3,amount:.8,shift:.04,dir:'v',snap:false,zoom:0,tone:.15,seed:58}},
  {name:'Распад', p:{mode:'tree',size:5,sizeVar:.8,detail:.9,amount:.6,shift:.1,dir:'any',snap:true,zoom:.2,tone:.4,passes:2,dropOn:true,drop:.3,fill:'#000000',clear:false,seed:2026}},
];

let src=null, raw2=null, src2=null, lum=null, url2=null;
let tS=null, tS2=null, tL=null;
let fileBase='cut-shift', isDemo=true, comparing=false, actual=false, fmt='png';
const out=$('#out'), ctx=out.getContext('2d');
const tmpMain=document.createElement('canvas');
const stage=$('#stage'), view=$('#view');

/* ---------- random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(...n){let h=2166136261;for(const x of n){h^=x|0;h=Math.imul(h,16777619);h^=h>>>13}return h>>>0}

/* ---------- luminance stats (integral images) ---------- */
function buildLum(c){
  const s=Math.min(1,220/Math.max(c.width,c.height));
  const w=Math.max(1,Math.round(c.width*s)), h=Math.max(1,Math.round(c.height*s));
  const t=document.createElement('canvas'); t.width=w; t.height=h;
  const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const I=new Float64Array((w+1)*(h+1)), I2=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){
    let rs=0,rs2=0;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4, a=d[i+3]/255;
      const L=((.299*d[i]+.587*d[i+1]+.114*d[i+2])/255)*a+(1-a);
      rs+=L; rs2+=L*L;
      const k=(y+1)*(w+1)+x+1;
      I[k]=I[k-(w+1)]+rs; I2[k]=I2[k-(w+1)]+rs2;
    }
  }
  return {w,h,sx:w/c.width,sy:h/c.height,I,I2};
}
function stats(L,x,y,bw,bh){
  const W=L.w+1;
  let x0=Math.floor(x*L.sx), y0=Math.floor(y*L.sy);
  let x1=Math.ceil((x+bw)*L.sx), y1=Math.ceil((y+bh)*L.sy);
  x0=Math.min(Math.max(x0,0),L.w-1); y0=Math.min(Math.max(y0,0),L.h-1);
  x1=Math.max(Math.min(x1,L.w),x0+1); y1=Math.max(Math.min(y1,L.h),y0+1);
  const n=(x1-x0)*(y1-y0);
  const S=L.I[y1*W+x1]-L.I[y0*W+x1]-L.I[y1*W+x0]+L.I[y0*W+x0];
  const S2=L.I2[y1*W+x1]-L.I2[y0*W+x1]-L.I2[y1*W+x0]+L.I2[y0*W+x0];
  const m=S/n;
  return {mean:m,std:Math.sqrt(Math.max(0,S2/n-m*m))};
}

/* ---------- block layouts ---------- */
function makeBlocks(W,H,rng,L,p){
  const base=Math.max(3,p.size/100*Math.min(W,H));
  const v=p.sizeVar, B=[];
  if(p.mode==='cols'||p.mode==='rows'){
    const len=p.mode==='cols'?W:H; let q=0;
    while(q<len){
      let s=Math.max(2,Math.round(base*(1+(rng()*2-1)*v*.9)));
      if(q+s>len) s=len-q;
      B.push(p.mode==='cols'?[q,0,s,H]:[0,q,W,s]); q+=s;
    }
  } else if(p.mode==='grid'){
    const nx=Math.ceil(W/base), ny=Math.ceil(H/base), used=new Uint8Array(nx*ny);
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      if(used[j*nx+i]) continue;
      let sx=1, sy=1;
      if(rng()<v){ sx=1+Math.floor(rng()*3); sy=1+Math.floor(rng()*3); }
      sx=Math.min(sx,nx-i); sy=Math.min(sy,ny-j);
      for(let a=1;a<sx;a++) if(used[j*nx+i+a]){sx=a;break;}
      for(let b=1;b<sy;b++){let ok=true;for(let a=0;a<sx;a++) if(used[(j+b)*nx+i+a]){ok=false;break;} if(!ok){sy=b;break;}}
      for(let b=0;b<sy;b++) for(let a=0;a<sx;a++) used[(j+b)*nx+i+a]=1;
      const x=Math.round(i*base), y=Math.round(j*base);
      const x2=Math.min(W,Math.round((i+sx)*base)), y2=Math.min(H,Math.round((j+sy)*base));
      if(x2>x&&y2>y) B.push([x,y,x2-x,y2-y]);
    }
  } else {
    const minS=Math.max(3,base*(1-.8*v)), maxS=base*(1+2.5*v);
    const split=(x,y,w,h)=>{
      const big=Math.max(w,h);
      let go;
      if(big<minS*2) go=false;
      else {
        const dp=Math.min(1,stats(L,x,y,w,h).std*5);
        go=rng()<(.35*(1-p.detail)+dp*p.detail);
      }
      if(!go){B.push([x,y,w,h]);return;}
      const vert = w>h ? rng()<.8 : rng()<.2;
      const r=.3+rng()*.4;
      if(vert){const a=Math.round(w*r); split(x,y,a,h); split(x+a,y,w-a,h);}
      else {const a=Math.round(h*r); split(x,y,w,a); split(x,y+a,w,h-a);}
    };
    const nx=Math.max(1,Math.round(W/maxS)), ny=Math.max(1,Math.round(H/maxS));
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const x=Math.round(i*W/nx), y=Math.round(j*H/ny);
      split(x,y,Math.round((i+1)*W/nx)-x,Math.round((j+1)*H/ny)-y);
    }
  }
  return B;
}

/* ---------- render ---------- */
function snapTo(d,s){let k=Math.round(d/s); if(k===0) k=d>0?1:-1; return k*s;}

function renderPass(g,S,S2,L,p,pass,W,H){
  const blocks=makeBlocks(W,H,mulberry32(hash(p.seed,pass,977)),L,p);
  const A=p.shift*Math.max(W,H);
  const useDrop=p.dropOn&&p.drop>0, use2=S2&&p.useSecond;
  blocks.forEach(([x,y,w,h],idx)=>{
    const r=mulberry32(hash(p.seed,pass,idx+1));
    const rDrop=r(), rAmt=r(), rx=r()*2-1, ry=r()*2-1, rz=r()*2-1, rMix=r(), rB=r()*2-1, rD=r();

    let dropIt=false;
    if(useDrop){
      dropIt=rDrop<p.drop;
    }
    if(dropIt){
      if(p.clear) g.clearRect(x,y,w,h);
      else { g.fillStyle=p.fill; g.fillRect(x,y,w,h); }
      return;
    }
    if(rAmt>=p.amount) return;

    let dx=p.dir!=='v'?rx*A:0, dy=p.dir!=='h'?ry*A:0;
    if(p.snap){ if(dx) dx=snapTo(dx,w); if(dy) dy=snapTo(dy,h); }
    const s=Math.max(.35,1+rz*p.zoom*.7);
    const sw=Math.min(w/s,W), sh=Math.min(h/s,H);
    let sx=x+w/2+dx-sw/2, sy=y+h/2+dy-sh/2;
    sx=Math.max(0,Math.min(W-sw,sx)); sy=Math.max(0,Math.min(H-sh,sy));
    const img=(use2&&rMix<p.mix)?S2:S;
    g.drawImage(img,sx,sy,sw,sh,x,y,w,h);

    if(p.tone>0){
      const b=rB*p.tone*.35, d=rD*p.tone*.9;
      if(Math.abs(b)>.005){g.globalAlpha=Math.abs(b);g.fillStyle=b>0?'#fff':'#000';g.fillRect(x,y,w,h);}
      if(d>.02){g.globalCompositeOperation='saturation';g.globalAlpha=d;g.fillStyle='#808080';g.fillRect(x,y,w,h);g.globalCompositeOperation='source-over';}
      g.globalAlpha=1;
    }
  });
}

function renderTo(g,S0,S2,L,p,tmp){
  const W=S0.width, H=S0.height, c=g.canvas;
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.clearRect(0,0,W,H); g.drawImage(S0,0,0);
  for(let pass=0;pass<p.passes;pass++){
    let S=S0;
    if(pass>0){
      tmp=tmp||document.createElement('canvas');
      if(tmp.width!==W||tmp.height!==H){tmp.width=W;tmp.height=H;}
      const tx=tmp.getContext('2d'); tx.clearRect(0,0,W,H); tx.drawImage(c,0,0); S=tmp;
    }
    renderPass(g,S,S2,L,p,pass,W,H);
  }
}
function render(){
  if(!src||comparing) return;
  renderTo(ctx,src,src2,lum,P,tmpMain);
  sizeCanvas();
}
function drawThumb(c,p){ if(tS) renderTo(c.getContext('2d'),tS,tS2,tL,p); }
let raf=0;
function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0;render();}); }

function sizeCanvas(){
  if(!out.width) return;
  let w,h;
  if(actual){ const d=window.devicePixelRatio||1; w=out.width/d; h=out.height/d; }
  else { const s=Math.min(view.clientWidth/out.width, view.clientHeight/out.height); w=out.width*s; h=out.height*s; }
  out.style.width=Math.floor(w)+'px'; out.style.height=Math.floor(h)+'px';
}
new ResizeObserver(()=>sizeCanvas()).observe(view);

/* ---------- images ---------- */
function scaled(im,max){
  const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
  const s=Math.min(1,max/Math.max(iw,ih));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(iw*s)); c.height=Math.max(1,Math.round(ih*s));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); return c;
}
function cover(im,W,H){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
  const s=Math.max(W/iw,H/ih);
  c.getContext('2d').drawImage(im,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s); return c;
}
function readImage(file){
  return new Promise((res,rej)=>{
    if(!file||!file.type.startsWith('image/')) return rej(new Error('type'));
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);res(im)};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
    im.src=url;
  });
}
function setSource(c,demo){
  src=c; lum=buildLum(src);
  src2=raw2?cover(raw2,src.width,src.height):null;
  tS=scaled(src,220); tL=buildLum(tS);
  tS2=raw2?cover(raw2,tS.width,tS.height):null;
  isDemo=demo;
  updateState(); renderPresets(); invalidateHist(); schedule();
}
async function loadMain(file){
  try{
    const im=await readImage(file);
    fileBase=(file.name||'photo').replace(/\.[^.]+$/,'')+'-cutshift';
    setSource(scaled(im,MAX),false);
  }catch(e){ toast('Этот файл не открылся. Нужен JPG, PNG или WebP.'); }
}
async function loadSecond(file){
  try{
    raw2=await readImage(file);
    if(src){ src2=cover(raw2,src.width,src.height); tS2=cover(raw2,tS.width,tS.height); }
    if(url2) URL.revokeObjectURL(url2);
    url2=URL.createObjectURL(file);
    const th=$('#th2'); th.src=url2; th.hidden=false;
    $('#f2t').textContent=file.name||'Второе фото';
    $('#rm2').hidden=false; $('#add2').textContent='Заменить';
    P.useSecond=true; secOpen('useSecond',true);
    sync(); schedule(); renderPresets(); invalidateHist(); commit();
  }catch(e){ toast('Второе фото не открылось. Нужен JPG, PNG или WebP.'); }
}
function removeSecond(){
  raw2=null; src2=null; tS2=null;
  if(url2){URL.revokeObjectURL(url2); url2=null;}
  const th=$('#th2'); th.hidden=true; th.removeAttribute('src');
  $('#f2t').textContent='Фото не выбрано';
  $('#rm2').hidden=true; $('#add2').textContent='Выбрать';
  P.useSecond=false;
  sync(); schedule(); renderPresets(); invalidateHist(); commit();
}

/* ---------- controls ---------- */
const SPEC=[
  {title:'Нарезка',open:true,items:[
    {type:'seg',key:'mode',opts:[['grid','Сетка'],['tree','Дробление'],['cols','Столбцы'],['rows','Строки']]},
    {type:'range',key:'size',label:'Размер блока',min:2,max:30,step:.5,k:1},
    {type:'range',key:'sizeVar',label:'Разнобой размеров',k:100},
    {type:'range',key:'detail',label:'Мельче там, где детали',k:100,when:()=>P.mode==='tree'},
  ]},
  {title:'Сдвиг',open:true,items:[
    {type:'range',key:'amount',label:'Сколько блоков сдвигать',k:100},
    {type:'range',key:'shift',label:'Сила сдвига',min:0,max:.4,step:.005,k:100},
    {type:'seg',key:'dir',label:'Направление',stack:true,opts:[['h','Вбок'],['v','Вверх-вниз'],['any','Любое']]},
    {type:'toggle',key:'snap',label:'Точные повторы',hint:'Сдвиг на целый блок — детали дублируются, как лишний глаз'},
  ]},
  {title:'Искажение',open:false,items:[
    {type:'range',key:'zoom',label:'Масштаб внутри блока',k:100},
    {type:'range',key:'tone',label:'Разброс тона',k:100},
    {type:'seg',key:'passes',label:'Слои поверх',num:true,opts:[[1,'1'],[2,'2'],[3,'3'],[4,'4']]},
  ]},
  {title:'Выпадение',open:false,toggle:'dropOn',items:[
    {type:'range',key:'drop',label:'Сколько выпадает',k:100},
    {type:'fill'},
  ]},
  {title:'Второе фото',open:false,toggle:'useSecond',items:[
    {type:'file2'},
    {type:'range',key:'mix',label:'Доля блоков из него',k:100,when:()=>!!raw2},
  ]},
];
const num=v=>String(Math.round(v*10)/10);

function change(it,v,final){
  P[it.key]=v;
  const t=it.sec.toggle;
  if(t&&!P[t]&&!(t==='useSecond'&&!raw2)) P[t]=true;
  sync(); schedule(); if(final) commit();
}

function makeItem(it){
  const w=document.createElement('div');
  if(it.type==='range'){
    const id='r_'+it.key, mn=it.min??0, mx=it.max??1;
    w.className='pill range';
    w.innerHTML=`<span class="fill"></span><span class="pl">${it.label}</span><span class="pv"><b></b><i>/${num(mx*it.k)}</i></span><input type="range" id="${id}" aria-label="${it.label}" min="${mn}" max="${mx}" step="${it.step??.01}">`;
    const inp=w.querySelector('input');
    inp.addEventListener('input',()=>change(it,parseFloat(inp.value),false));
    inp.addEventListener('change',()=>commit());
    inp.addEventListener('dblclick',()=>change(it,DEF[it.key],true));
    w.title='Двойной клик — вернуть по умолчанию';
  } else if(it.type==='seg'){
    w.className='pill segrow'+(it.label?'':' full')+(it.stack?' stack':'');
    w.innerHTML=`${it.label?`<span class="pl">${it.label}</span>`:''}<div class="seg" role="group"${it.label?` aria-label="${it.label}"`:''} style="--n:${it.opts.length}">${it.opts.map(([v,t])=>`<button type="button" data-v="${v}">${t}</button>`).join('')}</div>`;
    w.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>change(it,it.num?+b.dataset.v:b.dataset.v,true)));
  } else if(it.type==='toggle'){
    w.innerHTML=`<label class="pill tog"><span class="tt"><span>${it.label}</span><small>${it.hint}</small></span><span class="sw"><input type="checkbox"><span></span></span></label>`;
    w.className='grp';
    const c=w.querySelector('input'); c.addEventListener('change',()=>change(it,c.checked,true));
  } else if(it.type==='fill'){
    it.key='fill'; w.className='grp';
    w.innerHTML=`<div class="pill segrow"><span class="pl">Пустоты</span><div class="seg" role="group" aria-label="Чем заполнить пустоты" style="--n:2"><button type="button" data-v="0">Цвет</button><button type="button" data-v="1">Прозрачно</button></div></div>
      <label class="pill colorrow"><span class="chip">Цвет заливки</span><span class="chip hex"></span><input type="color" aria-label="Цвет заливки"></label>`;
    w.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>change({key:'clear',sec:it.sec},b.dataset.v==='1',true)));
    const ci=w.querySelector('input[type=color]');
    ci.addEventListener('input',()=>change(it,ci.value,false));
    ci.addEventListener('change',()=>commit());
  } else if(it.type==='file2'){
    w.className='grp';
    w.innerHTML=`<div class="pill f2"><img id="th2" alt="" hidden><span class="f2t" id="f2t">Фото не выбрано</span><button type="button" class="mini" id="add2">Выбрать</button><button type="button" class="mini" id="rm2" hidden>Убрать</button><input type="file" id="file2" accept="image/*" hidden></div><p class="note">Часть блоков берётся из второго снимка. Его можно перетащить на правую половину холста.</p>`;
    w.querySelector('#add2').addEventListener('click',()=>w.querySelector('#file2').click());
    w.querySelector('#file2').addEventListener('change',e=>{if(e.target.files[0]) loadSecond(e.target.files[0]); e.target.value='';});
    w.querySelector('#rm2').addEventListener('click',removeSecond);
  }
  it.el=w; return w;
}

function secOpen(key,v){
  const sec=SPEC.find(s=>s.toggle===key); if(!sec) return;
  sec.btn.setAttribute('aria-expanded',String(v)); sec.body.hidden=!v;
}
function build(){
  const root=$('#controls');
  SPEC.forEach((sec,i)=>{
    const s=document.createElement('section'); s.className='sec';
    const bid='sb'+i;
    s.innerHTML=`<div class="sech"><button type="button" class="sect" aria-expanded="${sec.open}" aria-controls="${bid}"><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${sec.title}</span></button>${sec.toggle?`<label class="sw"><input type="checkbox" aria-label="${sec.title}: включить"><span></span></label>`:''}</div><div class="secb" id="${bid}"${sec.open?'':' hidden'}></div>`;
    sec.btn=s.querySelector('.sect'); sec.body=s.querySelector('.secb');
    sec.btn.addEventListener('click',()=>{ const v=sec.btn.getAttribute('aria-expanded')!=='true'; sec.btn.setAttribute('aria-expanded',String(v)); sec.body.hidden=!v; });
    if(sec.toggle){
      sec.chk=s.querySelector('.sw input');
      sec.chk.addEventListener('change',()=>{
        P[sec.toggle]=sec.chk.checked;
        if(sec.chk.checked){ secOpen(sec.toggle,true); if(sec.toggle==='useSecond'&&!raw2) $('#file2').click(); }
        sync(); schedule(); commit();
      });
    }
    sec.items.forEach(it=>{ it.sec=sec; sec.body.appendChild(makeItem(it)); });
    root.appendChild(s);
  });
}
function luma(hex){ const n=parseInt(hex.slice(1),16); return (.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255; }

function sync(){
  for(const sec of SPEC){
    if(sec.chk) sec.chk.checked=!!P[sec.toggle];
    for(const it of sec.items){
      const w=it.el;
      if(it.when) w.hidden=!it.when();
      if(it.type==='range'){
        const inp=w.querySelector('input'), v=P[it.key];
        inp.value=v;
        const mn=+inp.min, mx=+inp.max;
        w.style.setProperty('--p',((v-mn)/(mx-mn)*100)+'%');
        w.querySelector('.pv b').textContent=num(v*it.k);
      } else if(it.type==='seg'){
        w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(P[it.key]))));
      } else if(it.type==='toggle'){
        w.querySelector('input').checked=!!P[it.key];
      } else if(it.type==='fill'){
        const row=w.querySelector('.colorrow');
        row.hidden=P.clear;
        row.classList.toggle('darkc',luma(P.fill)<.3);
        row.style.setProperty('--c',P.fill); w.querySelector('input[type=color]').value=P.fill;
        w.querySelector('.hex').textContent=P.fill;
        w.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='1')===!!P.clear)));
      }
    }
  }
  document.querySelectorAll('.pre').forEach((b,i)=>b.setAttribute('aria-pressed',String(presetMatch(PRESETS[i]))));
  syncSeed();
}
function syncSeed(){ $('#seedLbl').textContent=comparing?'Оригинал':'вариант #'+P.seed; }

/* ---------- presets ---------- */
function presetParams(pr){
  const o={}; for(const k of LOOK) o[k]=DEF[k];
  Object.assign(o,pr.p); o.useSecond=P.useSecond; o.mix=P.mix; return o;
}
function presetMatch(pr){ const o=presetParams(pr); return LOOK.every(k=>o[k]===P[k]); }
function buildPresets(){
  const box=$('#presets');
  PRESETS.forEach(pr=>{
    const b=document.createElement('button'); b.type='button'; b.className='pre';
    pr.c=document.createElement('canvas');
    b.appendChild(pr.c);
    b.setAttribute('aria-label',pr.name); b.title=pr.name;
    b.addEventListener('click',()=>{ Object.assign(P,presetParams(pr)); if(P.dropOn) secOpen('dropOn',true); sync(); schedule(); commit(); bumpBrand(); });
    box.appendChild(b);
  });
}
function renderPresets(){ PRESETS.forEach(pr=>drawThumb(pr.c,presetParams(pr))); }

/* ---------- history ---------- */
let hist=[], hi=-1;
function snapState(){ const o={}; for(const k of STATE) o[k]=P[k]; return JSON.stringify(o); }
function commit(){
  const s=snapState();
  if(hi>=0&&hist[hi].s===s) return;
  hist=hist.slice(0,hi+1); hist.push({s,c:null});
  if(hist.length>24) hist.shift();
  hi=hist.length-1;
  renderStrip();
}
function goTo(i){
  if(i<0||i>=hist.length||i===hi) return;
  hi=i; Object.assign(P,JSON.parse(hist[i].s));
  if(P.dropOn) secOpen('dropOn',true);
  sync(); schedule(); renderStrip(); bumpBrand();
}
function invalidateHist(){ hist.forEach(h=>h.c=null); renderStrip(); }
function renderStrip(){
  const box=$('#hist'); box.textContent='';
  hist.forEach((h,i)=>{
    if(!h.c&&tS){ h.c=document.createElement('canvas'); drawThumb(h.c,JSON.parse(h.s)); }
    const b=document.createElement('button'); b.type='button'; b.className='hs';
    b.setAttribute('aria-label','Шаг '+(i+1)+' из '+hist.length);
    if(i===hi) b.setAttribute('aria-current','true');
    if(h.c) b.appendChild(h.c);
    b.addEventListener('click',()=>goTo(i));
    box.appendChild(b);
  });
  const cur=box.children[hi]; if(cur) cur.scrollIntoView({block:'nearest',inline:'nearest'});
  $('#undo').disabled=hi<=0; $('#redo').disabled=hi>=hist.length-1;
}

/* ---------- brand ---------- */
function bumpBrand(){}

/* ---------- actions ---------- */
function newSeed(){ P.seed=1+Math.floor(Math.random()*99999); }
function shuffle(){
  const R=Math.random, pick=a=>a[Math.floor(R()*a.length)], rnd=(a,b,st)=>Math.round((a+R()*(b-a))/st)*st;
  P.mode=pick(['grid','tree','tree','cols','rows']);
  P.size=rnd(3,18,.5); P.sizeVar=rnd(0,1,.01); P.detail=rnd(.3,1,.01);
  P.amount=rnd(.2,.85,.01); P.shift=rnd(.015,.18,.005);
  P.dir=pick(['h','h','v','any']); P.snap=R()<.5;
  P.zoom=R()<.5?0:rnd(0,.6,.01); P.tone=rnd(0,.5,.01); P.passes=R()<.7?1:2;
  P.dropOn=R()<.45; P.drop=rnd(.05,.45,.01);
  if(raw2&&P.useSecond) P.mix=rnd(.1,.7,.01);
  newSeed(); sync(); schedule(); commit(); bumpBrand();
}
$('#shuffle').addEventListener('click',shuffle);
$('#undo').addEventListener('click',()=>goTo(hi-1));
$('#redo').addEventListener('click',()=>goTo(hi+1));

document.querySelectorAll('#fmt button').forEach(b=>b.addEventListener('click',()=>{fmt=b.dataset.v;syncFmt();}));
function syncFmt(){ document.querySelectorAll('#fmt button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===fmt))); }

function updateState(){
  $('#empty').hidden=!isDemo;
  $('#fileLabel').textContent=isDemo?'Загрузить фото':'Другое фото';
}

async function doSave(){
  if(!src) return;
  if(comparing) showOrig(false);
  render();
  let c=out;
  if(fmt==='jpg'){
    c=document.createElement('canvas'); c.width=out.width; c.height=out.height;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(out,0,0);
  }
  const type=fmt==='jpg'?'image/jpeg':'image/png';
  const blob=await new Promise(r=>c.toBlob(r,type,.92));
  if(!blob){ toast('Не получилось собрать файл'); return; }
  const filename=fileBase+'.'+fmt;
  {
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Скачано: '+filename);
  }
}
$('#save').addEventListener('click',doSave);
$('#emptyBtn').addEventListener('click',()=>$('#file').click());

/* compare */
function showOrig(on){
  if(!src||comparing===on) return;
  comparing=on; stage.classList.toggle('orig',on);
  if(on){ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,out.width,out.height); ctx.drawImage(src,0,0); }
  else render();
  syncSeed();
}
const cmp=$('#cmp');
cmp.addEventListener('pointerdown',e=>{e.preventDefault();cmp.setPointerCapture?.(e.pointerId);showOrig(true);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cmp.addEventListener(ev,()=>showOrig(false)));
cmp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.repeat){e.preventDefault();showOrig(true);} });
cmp.addEventListener('keyup',e=>{ if(e.key==='Enter') showOrig(false); });

/* fit / 1:1 */
function toggleFit(){ actual=!actual; view.classList.toggle('actual',actual); $('#fit').setAttribute('aria-pressed',String(actual)); sizeCanvas(); }
$('#fit').addEventListener('click',toggleFit);

let tt=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }

/* keyboard */
addEventListener('keydown',e=>{
  const t=e.target, tag=t.tagName, type=(t.type||'').toLowerCase();
  if(tag==='TEXTAREA'||(tag==='INPUT'&&!['range','checkbox'].includes(type))) return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.code==='KeyZ'){ e.preventDefault(); e.shiftKey?goTo(hi+1):goTo(hi-1); return; }
  if(mod&&e.code==='KeyY'){ e.preventDefault(); goTo(hi+1); return; }
  if(mod&&e.code==='KeyS'){ e.preventDefault(); doSave(); return; }
  if(mod||e.altKey) return;
  if(e.code==='Space'&&type!=='checkbox'){ e.preventDefault(); if(!e.repeat) showOrig(true); return; }
  if(e.code==='KeyR'){ e.preventDefault(); shuffle(); }
  else if(e.code==='KeyF'){ e.preventDefault(); toggleFit(); }
});
addEventListener('keyup',e=>{ if(e.code==='Space') showOrig(false); });
addEventListener('blur',()=>showOrig(false));

/* files */
$('#file').addEventListener('change',e=>{ if(e.target.files[0]) loadMain(e.target.files[0]); e.target.value=''; });
$('#fileLabel').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();$('#file').click();} });

let dragN=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
const hot=el=>document.querySelectorAll('.dz').forEach(d=>d.classList.toggle('hot',d===el));
addEventListener('dragenter',e=>{ if(hasFiles(e)){dragN++;stage.classList.add('dragging');} });
addEventListener('dragleave',()=>{ dragN=Math.max(0,dragN-1); if(!dragN){stage.classList.remove('dragging');hot(null);} });
addEventListener('dragover',e=>{ e.preventDefault(); hot(e.target.closest?.('.dz')||null); });
addEventListener('drop',e=>{
  e.preventDefault(); dragN=0; stage.classList.remove('dragging');
  const t=e.target.closest?.('.dz')?.dataset.t; hot(null);
  const f=e.dataTransfer.files[0]; if(!f) return;
  t==='second'?loadSecond(f):loadMain(f);
});
addEventListener('paste',e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadMain(f); });

/* ---------- start ---------- */
buildPresets(); build(); syncFmt(); sync(); bumpBrand(); updateState();
let started=false;
const start=async()=>{ if(started) return; started=true;
  try{ const im=await demo(); if(isDemo&&!src) setSource(scaled(im,MAX),true); }catch(e){}
  commit(); };
start();
})();
</script>
</body>
